[build]
  publish = "."

# The blog moved from /blog/ to /recursos-para-empresas/ (2026-08-29) — permanent redirect so
# existing search rankings/backlinks/bookmarks to any /blog/* URL keep working instead of 404ing.
[[redirects]]
  from = "/blog/*"
  to = "/recursos-para-empresas/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Static assets are cache-busted via ?v= query strings on every reference (see index.html),
# so it's safe to let browsers/CDN cache the underlying files aggressively — a content change
# always ships under a new URL rather than relying on this cache expiring.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
